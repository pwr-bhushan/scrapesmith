name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scrapesmith
          POSTGRES_PASSWORD: scrapesmith
          POSTGRES_DB: scrapesmith
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scrapesmith"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SCRAPESMITH_DATABASE_URL: postgresql+asyncpg://scrapesmith:scrapesmith@localhost:5432/scrapesmith
      SCRAPESMITH_REDIS_URL: redis://localhost:6379
      SKIP_PLAYWRIGHT: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: ruff check .
      # The service container starts an empty database. Without this the Postgres-gated
      # tests do not skip (Postgres is reachable) — they fail on "relation does not exist".
      - run: alembic upgrade head
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
