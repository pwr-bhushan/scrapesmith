# Local dev infra for scrapesmith (Phase 0.5).
# Canonical path when Docker is available; CI uses equivalent service containers.
# Without Docker locally, `brew install postgresql@16 redis` provides the same on 5432/6379.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: scrapesmith
      POSTGRES_PASSWORD: scrapesmith
      POSTGRES_DB: scrapesmith
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrapesmith"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
