<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Listing - Before Drift</title>
  <style>body { font-family: sans-serif; }</style>
  <script>console.log("tracking");</script>
</head>
<body>
  <!-- Product listing page — original markup -->
  <div id="productListing">
    <h1 class="product-title">Apple MacBook Pro 14-inch</h1>
    <div class="price-block">
      <span data-price-amount="149900" class="price-value">₹1,49,900</span>
      <span class="price-label">MRP</span>
    </div>
    <div class="rating-block">
      <span class="rating-value">4.6</span>
      <span class="rating-count">(1,234 ratings)</span>
    </div>
    <div class="availability">
      <span class="stock-status">In Stock</span>
    </div>
  </div>
</body>
</html>
