<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Monsoon Jazz Sessions — Tickets</title>
  <link rel="stylesheet" href="/t/event.css">
  <script src="/t/seatmap.js" defer></script>
</head>
<body class="event">
  <header class="tix-header"><span class="tix-brand">TicketYard</span></header>
  <section id="event-detail" class="event-detail">
    <div class="hero">
      <h1 class="event-name">Monsoon Jazz Sessions</h1>
      <p class="event-tagline">An evening of contemporary Indian jazz</p>
    </div>
    <div class="venue-block">
      <span class="venue-name">Shivaji Mandir Auditorium</span>
      <span class="venue-city">Mumbai</span>
      <time class="event-date" datetime="2026-07-18">18 July 2026, 7:30 PM</time>
    </div>
    <div class="ticket-block">
      <span class="ticket-price" data-price-paise="120000">₹1,200</span>
      <span class="ticket-tier">Silver</span>
      <span class="seats-left">42 seats left</span>
    </div>
    <div class="lineup"><h2>Lineup</h2><ul><li>Aditi Sen Quartet</li><li>The Bandra Horns</li></ul></div>
  </section>
  <footer class="tix-footer"><p>&copy; 2026 TicketYard</p></footer>
</body>
</html>
