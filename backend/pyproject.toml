[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scrapesmith"
version = "0.1.0"
description = "Self-healing HTML parser — spike + app skeleton"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "anthropic>=0.40",
    "playwright>=1.44",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    # app skeleton (Phase 0.5)
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "arq>=0.26",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py39"
line-length = 100
# spike/ is frozen Phase 0 de-risk code; alembic/versions is autogenerated.
extend-exclude = [".venv", "alembic/versions", "spike"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI Depends() in defaults is idiomatic.
# UP007/UP045: `X | None` union syntax breaks SQLAlchemy Mapped[] on the pinned Python 3.9 runtime.
ignore = ["B008", "UP007", "UP045"]
